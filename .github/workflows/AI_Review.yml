name: Code Review with ChatGPT

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run Code Review with ChatGPT
        uses: chetanya5/code-review-with-chatgpt@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          chatgpt_api_key: ${{ secrets.OPENAI_API_KEY }}
