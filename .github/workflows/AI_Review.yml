name: AI Code Review

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  ai_code_review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Code Review with ChatGPT
      uses: MishaKav/code-review-with-chatgpt@v1
      with:
        openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        comment_on_pr: true
        pr_comment_title: "AI Code Review"
        prompt: |
          Review the following code changes in the pull request and provide suggestions and improvements.
          Please focus on code quality, readability, and best practices.
