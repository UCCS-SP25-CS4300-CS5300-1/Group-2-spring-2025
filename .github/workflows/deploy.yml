name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - develop  # Trigger deployment when develop branch is updated

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CS4300
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          