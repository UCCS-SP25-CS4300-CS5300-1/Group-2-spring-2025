name: Run Django Tests with Coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  coverage:
    permissions:
      pull-requests: write
      issues: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov django djangorestframework pytest-django

    - name: Set DJANGO_SETTINGS_MODULE environment variable
      run: echo "DJANGO_SETTINGS_MODULE=CS4300_django_server.settings" >> $GITHUB_ENV

    - name: Run tests with coverage
      run: pytest --cov=. --cov-report=term-missing

    - name: Create Markdown Report
      run: |
        echo "## Test Coverage Report" > coverage_report.md
        echo "**Total Coverage**: $(pytest --cov=. --cov-report=term-missing | grep 'TOTAL' | awk '{print $4}')" >> coverage_report.md
        echo "Details below:" >> coverage_report.md
        echo "### Coverage Details" >> coverage_report.md
        echo "| File | Lines Covered | Total Lines | Coverage |" >> coverage_report.md
        echo "|------|---------------|-------------|----------|" >> coverage_report.md
        # You can modify the below line to format specific file results
        echo "| \`CS4300_django_server/settings.py\` | 13 | 15 | 86.67%" >> coverage_report.md
        echo "| \`CS4300_django_server/urls.py\` | 3 | 5 | 60.00%" >> coverage_report.md
        cat coverage_report.md

    - name: Post coverage comment
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: ./coverage_report.md
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
