name: Run Tests and Post Coverage Report

on:
  pull_request:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-django

      - name: Run tests with coverage (JSON format)
        run: pytest --cov=CS4300_django_server --cov-report=json:coverage.json

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
