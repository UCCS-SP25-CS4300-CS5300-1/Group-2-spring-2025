name: Run Django Tests with Coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
      contents: read
      actions: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov django djangorestframework pytest-django

    - name: Set DJANGO_SETTINGS_MODULE environment variable
      run: echo "DJANGO_SETTINGS_MODULE=CS4300_django_server.settings" >> $GITHUB_ENV

    - name: Run tests with coverage
      run: pytest --cov=. --cov-report=term-missing > coverage.txt

    - name: Generate coverage comment in markdown
      run: |
        echo "### Coverage Report" > coverage.md
        echo "" >> coverage.md
        echo "| File | Statements | Missed | Coverage |" >> coverage.md
        echo "|------|------------|--------|----------|" >> coverage.md
        tail -n +4 coverage.txt | awk -F'|' '{print "| " $1 " | " $2 " | " $3 " | " $4 " |"}' >> coverage.md

    - name: Post coverage comment
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: ./coverage.md
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
