name: Run Django Tests with Coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Allow write access to pull requests
      issues: read          # Read access to issues
      contents: read        # Read access to the repository contents (needed for some actions)
      actions: write        # Write permissions to trigger other actions


    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov django djangorestframework pytest-django

    - name: Set DJANGO_SETTINGS_MODULE environment variable
      run: echo "DJANGO_SETTINGS_MODULE=CS4300_django_server.settings" >> $GITHUB_ENV

    - name: Run tests with coverage
      run: pytest --cov=. --cov-report=xml

    - name: Create status check for coverage
      uses: actions/github-script@v6
      with:
        script: |
          const coverageResult = require('fs').readFileSync('./coverage.xml', 'utf8');
          const status = coverageResult.includes('100%') ? 'success' : 'failure';  // Customize condition based on coverage

          const prNumber = process.env.GITHUB_REF.split('/')[2];
          const statusCheck = await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: status,
            context: 'Test Coverage',
            description: 'Coverage status',
            target_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          });

