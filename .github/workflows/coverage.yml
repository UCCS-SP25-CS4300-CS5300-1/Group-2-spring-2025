name: Run Django Tests with Coverage

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
      contents: read
      actions: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov django djangorestframework pytest-django requests django-cors-headers pyzbar opencv-python numpy
        sudo apt-get update -y
        sudo apt-get install -y libzbar-dev

    - name: Set DJANGO_SETTINGS_MODULE environment variable
      run: echo "DJANGO_SETTINGS_MODULE=CS4300_django_server.settings" >> $GITHUB_ENV

    - name: Run migrations
      run: |
           cd CS4300/ 
           python manage.py makemigrations
           python manage.py migrate --noinput


    - name: Run tests with coverage (Console (asked for in sprint requirements) and XML report)
      run: pytest --cov=. --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=80

    - name: Post coverage comment using pytest-coverage-comment
      uses: MishaKav/pytest-coverage-comment@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pytest-xml-coverage-path: coverage.xml
