name: Run Django Tests with Coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
      contents: read
      actions: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov django djangorestframework pytest-django jq

    - name: Set DJANGO_SETTINGS_MODULE environment variable
      run: echo "DJANGO_SETTINGS_MODULE=CS4300_django_server.settings" >> $GITHUB_ENV

    - name: Run tests with coverage and output in JSON format
      run: pytest --cov=. --cov-report=term --cov-report=json:coverage.json

    - name: Parse JSON and extract coverage details
      id: parse_coverage
      run: |
        total_coverage=$(jq '.summary.total' coverage.json)
        covered=$(echo $total_coverage | jq .covered)
        missed=$(echo $total_coverage | jq .missed)
        percentage=$(echo $total_coverage | jq .percent_covered)
        echo "Coverage: $percentage% ($covered covered, $missed missed)" >> $GITHUB_ENV

    - name: Post coverage comment
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        message: |
          **Test Coverage Report**:
          - Total Coverage: ${{ env.percentage }}%
          - Covered: ${{ env.covered }}
          - Missed: ${{ env.missed }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
