name: Run Django Tests with Coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
      contents: read
      actions: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov django djangorestframework pytest-django

    - name: Set DJANGO_SETTINGS_MODULE environment variable
      run: echo "DJANGO_SETTINGS_MODULE=CS4300_django_server.settings" >> $GITHUB_ENV

    - name: Run tests with coverage
      run: pytest --cov=. --cov-report=term-missing > coverage.txt

    - name: Generate summary report
      run: |
        echo "### Coverage Summary" > coverage.md
        echo "" >> coverage.md

        # Extract total coverage percentage from the last line that contains 'TOTAL'
        TOTAL_COVERAGE=$(grep "TOTAL" coverage.txt | awk '{print $NF}')
        echo "#### Total Coverage: $TOTAL_COVERAGE" >> coverage.md
        echo "" >> coverage.md

        echo "#### Coverage Per File:" >> coverage.md
        echo "" >> coverage.md

        # Extract per-file coverage data, ensuring to pick lines that contain file paths
        grep -E "^[a-zA-Z0-9/_.-]+\.py" coverage.txt | awk '{ 
          if ($3 ~ /[0-9]+%/) { 
            print "- " $1 ": " $3 
          } 
        }' >> coverage.md

    - name: Post coverage comment
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: ./coverage.md
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
